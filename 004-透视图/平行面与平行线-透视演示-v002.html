<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平行面与平行线 · 透视演示</title><style>
:root{--ink:#243b39;--green:#326c5a}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#fff;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#stage{position:absolute;inset:0 268px 0 0;transition:right .25s}.fold #stage{right:42px}#tray{position:absolute;right:0;top:0;height:100%;width:268px;background:#fff;border-left:1px solid #e0e6df;transition:width .25s;display:flex;flex-direction:column}.fold #tray{width:42px}.fold .scroll{display:none}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #dbe2db;background:white;border-radius:5px;transition:background .15s}button:hover{background:#f0f4ee}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #b48345;outline-offset:2px}#collapse{position:absolute;right:8px;top:6px;z-index:2;width:26px;height:24px;font-size:17px;border:0;background:#edf2eb}.scroll{overflow:auto;padding:0 14px 12px}details{border-bottom:1px solid #e6eae3;padding:9px 0}details:first-child summary{padding-right:30px}summary{font-size:12px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:18px}summary:after{content:'−';color:#9ca99e}details:not([open]) summary:after{content:'+'}.body{padding-top:9px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px}.modes button{font-size:11px;padding:6px 2px}.modes button.wide{grid-column:1/-1}button.active{background:var(--green);border-color:var(--green);color:white}.layers{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.layer{display:flex;align-items:center;gap:6px;font-size:11px;min-height:27px;cursor:pointer;white-space:nowrap}.layer input{accent-color:var(--green);width:13px;height:13px;margin:0}.swatch{width:10px;height:2px;border-radius:2px;display:inline-block;margin-left:auto}.control{margin:0 0 10px}.control:last-child{margin-bottom:1px}.row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.value{color:#75867c;font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;accent-color:var(--green);height:12px;margin:0;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.actions button{padding:6px 3px;font-size:11px}@media(max-width:560px){body:not(.fold) #stage{right:42px}#tray{box-shadow:-8px 0 25px #243b3910}}
</style></head><body>
<main id="stage"><canvas id="scene" aria-label="平行面、平行线及其灭线和灭点的透视演示"></canvas></main>
<aside id="tray"><button id="collapse" aria-label="收起工具栏" title="收起工具栏">›</button><div class="scroll">
<details open><summary>讲解</summary><div class="body modes" id="modes"><button data-mode="planes">① 平行面</button><button data-mode="lines">② 平行线</button><button class="wide active" data-mode="both">③ 面 · 线 · 点</button></div></details>
<details open><summary>图层</summary><div class="body layers">
<label class="layer"><input type="checkbox" id="planes" checked>平行面<span class="swatch" style="background:#739783"></span></label>
<label class="layer"><input type="checkbox" id="uLines" checked>A 组平行线<span class="swatch" style="background:#bd8848"></span></label>
<label class="layer"><input type="checkbox" id="vLines" checked>B 组平行线<span class="swatch" style="background:#567e9d"></span></label>
<label class="layer"><input type="checkbox" id="extensions" checked>延长线<span class="swatch" style="background:repeating-linear-gradient(90deg,#87938a 0 4px,transparent 4px 7px)"></span></label>
<label class="layer"><input type="checkbox" id="vanish" checked>灭线 · 灭点<span class="swatch" style="background:#326c5a"></span></label>
<label class="layer"><input type="checkbox" id="labels" checked>名称标记</label>
</div></details>
<details open><summary>空间与视角</summary><div class="body">
<div class="control"><label class="row" for="height">物体高度<span class="value" id="heightVal"></span></label><input id="height" type="range" min="-2" max="3" step="0.1" value="0"></div>

<div class="control"><label class="row" for="yaw">平面转向<span class="value" id="yawVal"></span></label><input id="yaw" type="range" min="25" max="65" value="43"></div>
<div class="control"><label class="row" for="tilt">平面倾角<span class="value" id="tiltVal"></span></label><input id="tilt" type="range" min="-25" max="25" value="0"></div>
<div class="control"><label class="row" for="pitch">视线俯角<span class="value" id="pitchVal"></span></label><input id="pitch" type="range" min="3" max="30" value="13"></div>
<div class="control"><label class="row" for="gap">平行面间距<span class="value" id="gapVal"></span></label><input id="gap" type="range" min="25" max="125" value="75"></div>
<div class="control"><label class="row" for="distance">延伸距离<span class="value" id="distanceVal"></span></label><input id="distance" type="range" min="0" max="100" value="100"></div>
</div></details>

<details open><summary>演示控制</summary><div class="body actions"><button id="animate">自动旋转</button><button id="reset">复位</button><button id="fullscreen">全屏</button><button id="download">保存网页</button></div></details>
</div></aside>
<script>
(()=>{'use strict';const $=s=>document.getElementById(s),c=$('scene'),ctx=c.getContext('2d');const toggles=['planes','uLines','vLines','extensions','vanish','labels'],ranges=['yaw','tilt','pitch','gap','height','distance'];let W,H,DPR,mode='both',running=false,last=0,phase=0;let values={};const colors={u:'#b9823d',v:'#517b9d',green:'#326c5a'};const rad=d=>d*Math.PI/180,add=(a,b)=>a.map((v,i)=>v+b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];let u,v,n,cam,up,forward,f,cx,cy;const on=id=>$(id).checked;
function update(){for(const id of ranges){values[id]=+$(id).value;$(id+'Val').textContent=id==='height'?values[id].toFixed(1):id==='gap'?(values[id]/100).toFixed(2):id==='distance'?values[id]+'%':values[id]+'°'}draw()}
function setup(){let a=rad(values.yaw),t=rad(values.tilt),p=rad(values.pitch);u=[Math.cos(a)*Math.cos(t),Math.sin(t),-Math.sin(a)*Math.cos(t)];v=[-Math.sin(a),0,-Math.cos(a)];n=cross(u,v);forward=[0,-Math.sin(p),-Math.cos(p)];up=[0,Math.cos(p),-Math.sin(p)];cam=[0,1.1+7.5*Math.sin(p),7.5*Math.cos(p)];f=Math.min(W*.38,H*.78);cx=W*.49;cy=H*.53}
function project(P,dir=false){const q=dir?P:add(P,mul(cam,-1)),z=dot(q,forward);return [cx+f*q[0]/z,cy-f*dot(q,up)/z,z]}
function point(a,b,h){return add(add(add(mul(u,a),mul(v,b)),mul(n,h)),[0,values.height,0])}
function line(a,b,color,width=1,dash=[],alpha=1,context=ctx){context.save();context.strokeStyle=color;context.lineWidth=width;context.setLineDash(dash);context.globalAlpha=alpha;context.beginPath();context.moveTo(a[0],a[1]);context.lineTo(b[0],b[1]);context.stroke();context.restore()}
function polygon(pts,fill,stroke,width=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
function label(x,y,text,color='#52685a',size=12){ctx.save();ctx.font=`${size}px "Microsoft YaHei",sans-serif`;const w=ctx.measureText(text).width;ctx.fillStyle='#fffefbeF';ctx.beginPath();ctx.roundRect(x-6,y-size-3,w+12,size+11,4);ctx.fill();ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore()}
function fullLine(A,B,color,dash=[]){let dx=B[0]-A[0],dy=B[1]-A[1];if(Math.abs(dx)<.001)return;let t0=-A[0]/dx,t1=(W-A[0])/dx;line([0,A[1]+dy*t0],[W,A[1]+dy*t1],color,1.6,dash)}
function draw(){if(!W)return;setup();ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const A=project(u,true),B=project(v,true);const hs=[-.9,0,.9].map(h=>h*values.gap/75);const showP=on('planes'),showU=on('uLines'),showV=on('vLines');
// Project actual parallel planes and actual parallel line segments.
for(let k=0;k<3;k++){const h=hs[k],corn=[[-2.7,-2.4],[2.7,-2.4],[2.7,3],[-2.7,3]].map(([a,b])=>project(point(a,b,h)));if(showP&&on('extensions')){const q=corn[0],r=values.distance/100,ea=[q[0]+(A[0]-q[0])*r,q[1]+(A[1]-q[1])*r],eb=[q[0]+(B[0]-q[0])*r,q[1]+(B[1]-q[1])*r];polygon([q,ea,eb],'#789c7d07','transparent',0);line(q,ea,'#73937a',.8,[4,6],.32);line(q,eb,'#73937a',.8,[4,6],.32)}if(showP)polygon(corn,['#dce6da70','#d9e5dc88','#d2e0d3a0'][k],'#8da893',1.1);for(const family of ['u','v']){if(family==='u'?!showU:!showV)continue;const VP=family==='u'?A:B,col=colors[family];for(const offset of [-1.7,0,1.7]){let P=family==='u'?point(-2.7,offset,h):point(offset,-2.4,h),Q=family==='u'?point(2.7,offset,h):point(offset,3,h);let s=project(P),e=project(Q);line(s,e,col,offset===0?2:1.3,[],.85);if(on('extensions')){const near=s[2]>e[2]?s:e;const rate=values.distance/100;const dest=[near[0]+(VP[0]-near[0])*rate,near[1]+(VP[1]-near[1])*rate];line(near,dest,col,.9,[5,5],.39)}}}if(showP&&on('labels')){let p=corn[0];label(p[0]-26,p[1]+(k-1)*2,['α₁','α₂','α₃'][k],'#698171',13)}}
if(on('vanish')){fullLine(A,B,colors.green,[8,5]);if(on('labels')){let x=22,y=A[1]+(B[1]-A[1])*(x-A[0])/(B[0]-A[0]);label(x,y-13,values.tilt===0?'灭线 l · 视平线':'灭线 l',colors.green,12)}for(const [P,id] of [[A,'u'],[B,'v']]){if(id==='u'?!showU:!showV)continue;let x=P[0],y=P[1];if(x<16||x>W-16||y<26||y>H-18){const nx=Math.max(18,Math.min(W-18,x)),ny=Math.max(30,Math.min(H-20,y));if(on('labels'))label(Math.min(W-85,nx+8),ny-10,id==='u'?'Vₐ ↗':'Vᵦ ↖',colors[id]);continue}ctx.fillStyle='#fffefb';ctx.strokeStyle=colors[id];ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=colors[id];ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();if(on('labels'))label(x-13,y-18,id==='u'?'灭点 Vₐ':'灭点 Vᵦ',colors[id],12)}}}
function resize(){const rect=c.getBoundingClientRect();W=rect.width;H=rect.height;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw()}
for(const id of [...toggles,...ranges])$(id).addEventListener('input',update);
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('planes').checked=mode!=='lines';$('uLines').checked=mode!=='planes';$('vLines').checked=mode!=='planes';$('extensions').checked=true;$('vanish').checked=true;update()};
$('collapse').onclick=()=>{document.body.classList.toggle('fold');const folded=document.body.classList.contains('fold');$('collapse').textContent=folded?'‹':'›';$('collapse').setAttribute('aria-label',folded?'展开工具栏':'收起工具栏');$('collapse').title=folded?'展开工具栏':'收起工具栏'};
function stop(){running=false;$('animate').classList.remove('active');$('animate').textContent='自动旋转'}$('animate').onclick=()=>{running=!running;$('animate').classList.toggle('active',running);$('animate').textContent=running?'暂停旋转':'自动旋转';if(running){phase=Math.asin(Math.max(-1,Math.min(1,(values.yaw-45)/18)));last=0;requestAnimationFrame(tick)}};function tick(t){if(!running)return;if(last)phase+=(t-last)*.00028;last=t;$('yaw').value=Math.round(45+18*Math.sin(phase));update();requestAnimationFrame(tick)}
$('reset').onclick=()=>{stop();Object.entries({yaw:43,tilt:0,pitch:13,gap:75,height:0,distance:100}).forEach(([k,v])=>$(k).value=v);toggles.forEach(k=>$(k).checked=true);mode='both';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));update()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
$('download').onclick=()=>{stop();document.querySelectorAll('input').forEach(e=>{if(e.type==='checkbox'){e.toggleAttribute('checked',e.checked)}else e.setAttribute('value',e.value)});const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}));a.href=url;a.download='平行面与平行线-透视演示-v002.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let drag=null;c.addEventListener('pointerdown',e=>{stop();drag={x:e.clientX,y:e.clientY,yaw:values.yaw,pitch:values.pitch};c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'});c.addEventListener('pointermove',e=>{if(!drag)return;$('yaw').value=Math.max(25,Math.min(65,drag.yaw+(e.clientX-drag.x)*.1));$('pitch').value=Math.max(3,Math.min(30,drag.pitch+(e.clientY-drag.y)*.08));update()});c.addEventListener('pointerup',()=>{drag=null;c.style.cursor='grab'});c.addEventListener('pointercancel',()=>drag=null);c.style.cursor='grab';new ResizeObserver(resize).observe($('stage'));if(innerWidth<760)document.body.classList.add('fold');$('collapse').textContent=document.body.classList.contains('fold')?'‹':'›';update();resize();window.demoState=()=>({values:{...values},layers:Object.fromEntries(toggles.map(k=>[k,on(k)])),vanishingPoints:{A:project(u,true),B:project(v,true)}});
})();
</script></body></html>
