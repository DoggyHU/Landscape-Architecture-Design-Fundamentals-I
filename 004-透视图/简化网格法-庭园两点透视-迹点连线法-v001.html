<script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#scene'),overlay=$('#overlay'),ctx=overlay.getContext('2d');
const gl=canvas.getContext('webgl',{antialias:true,alpha:true,preserveDrawingBuffer:true});
let W=1,H=1,dpr=1,camera,dirty=true,playTimer=null,meshDirty=true,meshes={},program,buffers={};
const V={add:(a,b)=>a.map((v,i)=>v+b[i]),sub:(a,b)=>a.map((v,i)=>v-b[i]),mul:(a,k)=>a.map(v=>v*k),dot:(a,b)=>a.reduce((v,x,i)=>v+x*b[i],0),cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit:a=>{const n=Math.hypot(...a);return a.map(v=>v/(n||1))}};
function rgba(hex,alpha=1){return [parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255,alpha]}
const C={stone:rgba('#edece5'),white:rgba('#f7f6f0'),edge:rgba('#6a7775'),ground:rgba('#f2f1ea'),soil:rgba('#999684'),green:rgba('#71957e'),green2:rgba('#a3b39a'),dark:rgba('#527464'),wood:rgba('#8d7e68'),water:rgba('#5eabc1'),blue:rgba('#279bde'),red:rgba('#d85950'),paleBlue:rgba('#b6dced')};
function group(){return {tri:[],line:[]}}
function triangle(g,a,b,c,color){const n=V.unit(V.cross(V.sub(b,a),V.sub(c,a)));for(const p of [a,b,c])g.tri.push(...p,...n,...color)}
function quad(g,a,b,c,d,color){triangle(g,a,b,c,color);triangle(g,a,c,d,color)}
function line(g,a,b,color=C.edge){g.line.push(...a,0,1,0,...color,...b,0,1,0,...color)}
function outline(g,pts,col=C.edge){for(let i=0;i<pts.length;i++)line(g,pts[i],pts[(i+1)%pts.length],col)}
function box(g,x,y,z,w,h,d,col=C.stone,edges=true){const a=[x,y,z],b=[x+w,y,z],c=[x+w,y,z+d],e=[x,y,z+d],f=[x,y+h,z],j=[x+w,y+h,z],k=[x+w,y+h,z+d],l=[x,y+h,z+d];quad(g,a,e,c,b,col);quad(g,f,j,k,l,col);quad(g,a,b,j,f,col);quad(g,b,c,k,j,col);quad(g,c,e,l,k,col);quad(g,e,a,f,l,col);if(edges){outline(g,[f,j,k,l]);outline(g,[a,b,c,e]);for(const [p,q]of [[a,f],[b,j],[c,k],[e,l]])line(g,p,q)}}
function cylinder(g,x,y,z,r,h,col,n=32,rTop=r,edges=true){for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2,p=[x+Math.cos(a)*r,y,z+Math.sin(a)*r],q=[x+Math.cos(b)*r,y,z+Math.sin(b)*r],u=[x+Math.cos(a)*rTop,y+h,z+Math.sin(a)*rTop],v=[x+Math.cos(b)*rTop,y+h,z+Math.sin(b)*rTop];quad(g,p,q,v,u,col);triangle(g,[x,y+h,z],u,v,col);if(edges){line(g,u,v);line(g,p,q)}}}
function ring(g,x,y,z,ro,ri,h,col,n=48){for(let i=0;i<n;i++){const a=i/n*2*Math.PI,b=(i+1)/n*2*Math.PI,at=(r,yy,t)=>[x+r*Math.cos(t),yy,z+r*Math.sin(t)],p=at(ro,y,a),q=at(ro,y,b),u=at(ro,y+h,a),v=at(ro,y+h,b),f=at(ri,y+h,a),j=at(ri,y+h,b);quad(g,p,q,v,u,col);quad(g,u,v,j,f,col);quad(g,f,j,at(ri,y,b),at(ri,y,a),col);line(g,u,v);line(g,f,j);line(g,p,q)}}
function ellipsoid(g,x,y,z,rx,ry,rz,col,segments=10,rings=6,wire=false){for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const at=(u,v)=>{const a=u/segments*2*Math.PI,b=v/rings*Math.PI;return [x+rx*Math.cos(a)*Math.sin(b),y+ry*Math.cos(b),z+rz*Math.sin(a)*Math.sin(b)]},a=at(i,j),b=at(i+1,j),c=at(i+1,j+1),d=at(i,j+1);quad(g,a,b,c,d,col);if(wire&&j!==0&&j!==rings-1)line(g,a,b,rgba('#678374'))}}
function branch(g,a,b,r,col=C.wood){const v=V.unit(V.sub(b,a)),u=V.unit(V.cross(v,Math.abs(v[1])>.9?[1,0,0]:[0,1,0])),w=V.cross(v,u);for(let i=0;i<7;i++){const t=i/7*Math.PI*2,s=(i+1)/7*Math.PI*2,at=(p,k,t)=>V.add(p,V.add(V.mul(u,Math.cos(t)*k),V.mul(w,Math.sin(t)*k)));quad(g,at(a,r,t),at(a,r,s),at(b,r*.56,s),at(b,r*.56,t),col)}}
let seed=17;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function tree(g,x,z,h,r,base=0){const trunk=h*.66;branch(g,[x,base,z],[x+.03,base+trunk,z+.02],.05);for(let i=0;i<7;i++){const a=i*2.4,yy=base+h*(.47+i*.05),b=[x+Math.cos(a)*r*.62,yy+.36,z+Math.sin(a)*r*.62];branch(g,[x,yy-.25,z],b,.028);for(let j=0;j<4;j++){const cx=b[0]+(rnd()-.5)*r*.65,cy=b[1]+(rnd()-.35)*r*.55,cz=b[2]+(rnd()-.5)*r*.65;ellipsoid(g,cx,cy,cz,r*.32,r*.39,r*.32,j%2?C.green:C.green2,8,5)}}ellipsoid(g,x,base+h-r*.23,z,r*.49,r*.5,r*.49,C.green2,10,5)}
function shrub(g,x,z,r,h,base=.12){for(let i=0;i<5;i++){const a=i*2.4,rr=r*(.3+rnd()*.3);ellipsoid(g,x+Math.cos(a)*rr,base+h*.55+(rnd()-.5)*h*.2,z+Math.sin(a)*rr,r*.52,h*.5,r*.52,i%2?C.green:C.green2,8,5)}}
function tuft(g,x,z,r,h,base=.12){for(let i=0;i<9;i++){const a=i*2.4,b=[x+Math.cos(a)*r,base+h*(.55+rnd()*.45),z+Math.sin(a)*r],mid=[x+Math.cos(a)*r*.5,base+h*.7,z+Math.sin(a)*r*.5],p=[x,base,z],u=[mid[0]-Math.sin(a)*.036,mid[1],mid[2]+Math.cos(a)*.036],v=[mid[0]+Math.sin(a)*.036,mid[1],mid[2]-Math.cos(a)*.036];triangle(g,p,u,v,C.dark);triangle(g,u,b,v,C.green)}}
function build(){seed=17;meshes={floor:group(),grid:group(),bed:group(),body:group(),plants:group(),water:group(),construction:group(),eye:group(),sight:group(),plan:group(),plane:group(),height:group(),person:group()};const {floor,grid,bed,body,plants,water,construction,eye:eyeGroup,sight,plan,plane,height,person}=meshes;
box(floor,-3,-.065,0,6,.065,6,C.ground,false);outline(floor,[[-3,.004,0],[3,.004,0],[3,.004,6],[-3,.004,6]],rgba('#9aaba7'));
for(let i=0;i<=8;i++){const x=-3+i*.75,z=i*.75;line(grid,[x,.012,0],[x,.012,6],state.step>=7&&state.step<=9?C.blue:rgba('#acb5ad'));line(grid,[-3,.012,z],[3,.012,z],state.step>=7&&state.step<=9?C.blue:rgba('#acb5ad'))}
box(bed,-2.93,.013,0,1.64,.10,1.05,C.soil);box(bed,-2.92,.013,5.05,5.86,.1,.88,C.soil);box(bed,1.55,.013,2.65,1.38,.1,2.42,C.soil);
box(body,-3.11,0,0,.16,state.wall,6.1,C.stone);box(body,-3.11,0,5.94,6.22,.92,.16,C.stone);box(body,2.96,0,0,.1,.14,5.94,C.stone);
box(body,1.49,0,2.59,.17,.48,2.47,C.white);box(body,1.49,0,4.90,1.48,.48,.17,C.white);
box(body,2.20,.05,.67,.58,.39,1.75,C.stone);box(body,2.13,.44,.61,.75,.12,1.88,C.white);box(body,2.86,.46,.65,.07,.42,1.80,C.stone);
box(body,-2.91,.02,2.78,.53,.4,1.04,C.stone);box(body,-2.96,.42,2.72,.67,.12,1.16,C.white);
box(body,-2.91,.02,4.36,3.04,.4,.48,C.stone);box(body,-2.96,.42,4.30,3.14,.12,.63,C.white);

/* ================= 地面作图：基线 · 迹点 · 灭点 =================
   核心：一条地面直线 L 的像 = 「L 与画面 K 的交点（迹点 T）」→「L 方向的灭点 V」这条直线。
   所以：迹点连灭点 = 网格线。两组的迹点都存在 → 一点/两点都成立。
   只有「平行于画面」的那组线没有迹点（永远撞不到画面），才需要 45° 对角线灭点 M。            */
function vpOfDir(dir){const o=observerFrame(),den=V.dot(dir,o.forward);if(Math.abs(den)<1e-4)return null;return {p:V.add(o.eye,V.mul(dir,planeDist()/den)),deg:Math.atan2(V.dot(dir,o.right),den)*180/Math.PI}}
function traceOnK(a,b){const o=observerFrame(),A=worldPoint(a),B=worldPoint(b),da=V.dot(V.sub(A,o.eye),o.forward),db=V.dot(V.sub(B,o.eye),o.forward),den=db-da;if(Math.abs(den)<1e-7)return null;return V.add(A,V.mul(V.sub(B,A),(planeDist()-da)/den))}
function baselineScreenY(){const o=observerFrame(),f=[o.eye[0]+o.forward[0]*planeDist(),0,o.eye[2]+o.forward[2]*planeDist()],p=project(f,false);return p?p.y:null}
function groundSegs(){const out=[];for(let i=0;i<=8;i++){const v=-3+i*.75;out.push({fam:'z',a:[v,0,0],b:[v,0,6]})}for(let i=0;i<=8;i++){const v=i*.75;out.push({fam:'x',a:[-3,0,v],b:[3,0,v]})}return out}
function isTwoPointView(){try{return !!(vpOfDir(axisZ())&&vpOfDir(axisX()))}catch(e){return false}}
function rawLabel(text,p,color='#111',align='left'){if(!state.labels)return;ctx.font='12px Arial,"Noto Sans SC","Microsoft YaHei",sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';const w=ctx.measureText(text).width,x=align==='center'?p.x-w/2-5:align==='right'?p.x-w-5:p.x-5,y=Math.max(12,Math.min(H-12,p.y));ctx.fillStyle='#ffffffdd';ctx.fillRect(x,y-9,w+10,18);ctx.fillStyle=color;ctx.fillText(text,p.x,y)}
function dotMark(p,color,size=3.6){ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function onCanvas(p){return !!p&&p.x>=4&&p.x<=W-4&&p.y>=4&&p.y<=H-4}
function edgeMark(p,text,color){const ex=Math.max(14,Math.min(W-14,p.x)),ey=Math.max(18,Math.min(H-18,p.y));let ang=Math.atan2(p.y-ey,p.x-ex);if(!isFinite(ang)||(Math.abs(ang)<.2&&Math.abs(p.x-ex)<1))ang=p.x<W/2?Math.PI:0;ctx.beginPath();ctx.moveTo(ex+Math.cos(ang)*10,ey+Math.sin(ang)*10);ctx.lineTo(ex+Math.cos(ang+2.5)*10,ey+Math.sin(ang+2.5)*10);ctx.lineTo(ex+Math.cos(ang-2.5)*10,ey+Math.sin(ang-2.5)*10);ctx.closePath();ctx.fillStyle=color;ctx.fill();const left=Math.cos(ang)<0;rawLabel(text,{x:ex+(left?14:-14),y:ey-Math.sin(ang)*11},color,left?'left':'right')}
function tickMark(p,color='#111111'){if(!p)return;screenLine({x:p.x,y:p.y-5},{x:p.x,y:p.y+5},color,1.3);dotMark(p,color,2.4)}
function drawBaselineRow(){const y=baselineScreenY();if(y===null)return null;if(y<-4||y>H+4)return y;screenLine({x:0,y},{x:W,y},'#111111',2.2);if(y>44&&y<H-26){const above=y>40?y-23:y+20;rawLabel('基线 O–X（画面与地面相交 · 真长）',{x:20,y:above},'#333333','left')}return y}

function drawGridConstruction(){
const vpZ=vpOfDir(axisZ()),vpX=vpOfDir(axisX()),two=!!(vpZ&&vpX);
const yb=drawBaselineRow();
const items=groundSegs().map(s=>{const fa=flatten(s.a),fb=flatten(s.b),T=traceOnK(s.a,s.b),vp=(s.fam==='z'?vpZ:vpX);
return {s,vp:vp&&project(vp.p,false),pt:T&&project(T,false),pa:fa&&project(fa,false),pb:fb&&project(fb,false)}});

function dirAtAngle(thDeg){const o=observerFrame(),th=thDeg*Math.PI/180;return V.unit(V.add(V.mul(o.forward,Math.cos(th)),V.mul(o.right,-Math.sin(th))))}
function vpOnPicture(thDeg){const o=observerFrame(),d=dirAtAngle(thDeg),t=planeDist()/Math.max(.05,V.dot(d,o.forward));return V.add(o.eye,V.mul(d,t))}
function parallelConstruction(){
const o=observerFrame(),dir=dirAtAngle(45);
const t=planeDist()/Math.max(.05,V.dot(dir,o.forward));
const mPoint=V.add(o.eye,V.mul(dir,t));
const past=V.add(o.eye,V.mul(dir,t+1.7));
const eye=[o.eye[0],0,o.eye[2]];
const A=[3,0,0],B=[-3,0,6];
const toPicture=P=>{const v=V.sub(P,o.eye),u=(0-o.eye[2])/(v[2]||1e-6);const q=V.add(o.eye,V.mul(v,u));q[1]=0;return q};
const sight=[.30,.62,1.05].map(tt=>{const P=[A[0]+(B[0]-A[0])*tt,0,A[2]+(B[2]-A[2])*tt];return {P,img:toPicture(P)}});
return {eye,mPoint,past,altPoint:vpOnPicture(-33),foot:[o.centre[0],0,o.centre[2]],diagA:A,diagB:B,sight};
}
/* ================= 视点环绕 / 灭点推导 ================= */
function observerFrame(){
const a=state.heading*Math.PI/180;
if(Math.abs(state.orbitDeg||0)<.01){
const forward=[Math.sin(a),0,Math.cos(a)],right=[Math.cos(a),0,-Math.sin(a)],eye=[state.eyeX,state.eye,-state.distance];orbitPlaneD=null;
const centre=V.add(eye,V.mul(forward,state.distance));centre[1]=0;
return {eye,forward,right,centre};
}
const th=(state.orbitDeg||0)*Math.PI/180;
const forward=[Math.sin(th),0,Math.cos(th)],right=[Math.cos(th),0,-Math.sin(th)];
const R=Math.max(4,Math.min(22,state.orbitR||10));
const ex=-Math.sin(th)*R,ez=3-Math.cos(th)*R,eye=[ex,state.eye,ez];
let D=1e9;
for(const c of [[-3,0],[3,0],[-3,6],[3,6]]){const dep=(c[0]-ex)*forward[0]+(c[1]-ez)*forward[2];if(dep<D)D=dep}
D=Math.max(D,.9);
orbitPlaneD=D;
const centre=[ex+forward[0]*D,0,ez+forward[2]*D];
return {eye,forward,right,centre};
}
function vanishingPoint(direction,offset=0){const o=observerFrame(),den=V.dot(direction,o.forward);if(Math.abs(den)<.0001)return null;return V.add(o.eye,V.mul(direction,(planeDist()+offset)/den))}
function edgeDirections(){
const a=state.angle*Math.PI/180;
return [{d:[Math.sin(a),0,Math.cos(a)],name:'V₁',label:'纵深边'},{d:[Math.cos(a),0,-Math.sin(a)],name:'V₂',label:'横向边'}];
}
function derivedVPs(){
const o=observerFrame(),out=[];
for(const it of edgeDirections()){
let den=V.dot(it.d,o.forward),dir=it.d;
if(den<0){den=-den;dir=V.mul(it.d,-1)}
if(Math.abs(den)<.02){out.push({name:it.name,label:it.label,infinite:true,dir});continue}
const t=planeDist()/den,p=V.add(o.eye,V.mul(dir,t));
const deg=Math.atan2(V.dot(dir,o.right),den)*180/Math.PI;
out.push({name:it.name,label:it.label,infinite:false,dir,p,deg,dist:Math.abs(planeDist()*Math.tan(deg*Math.PI/180))});
}
return out;
}

if(state.step<=4)for(const off of [-1.8,0,1.8]){

ctx.beginPath();ctx.arc(p.x,p.y,8.5,0,Math.PI*2);ctx.strokeStyle='rgba(229,72,60,.3)';ctx.lineWidth=1;ctx.stroke();

canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{if(state.view==='picture')return;e.preventDefault();state.zoom=Math.min(3.2,Math.max(.48,state.zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='BUTTON'||t.tagName==='SUMMARY'))return;if(e.key==='ArrowRight'){e.preventDefault();setStep(state.step+1)}else if(e.key==='ArrowLeft'){e.preventDefault();setStep(state.step-1)}else if(e.code==='Space'){e.preventDefault();togglePlay()}});

/* ================= 成图预览（离屏渲染 → 2D 画布） ================= */
const pvEl=$('#preview'),pvCtx=pvEl?pvEl.getContext('2d'):null;
const pvTmp=document.createElement('canvas'),pvTmpCtx=pvTmp.getContext('2d');
let fbo=null,fbTex=null,fbDepth=null,fbW=0,fbH=0,fbPix=null;
function ensureFBO(w,h){
if(!gl)return false;
if(fbo&&fbW===w&&fbH===h)return true;
fbW=w;fbH=h;
if(!fbo)fbo=gl.createFramebuffer();
if(!fbTex)fbTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,fbTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
if(!fbDepth)fbDepth=gl.createRenderbuffer();
gl.bindRenderbuffer(gl.RENDERBUFFER,fbDepth);
gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fbTex,0);
gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,fbDepth);
const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
fbPix=new Uint8Array(w*h*4);
return ok;
}
function renderPreview(){
if(!gl||!pvCtx)return;
const w=pvEl.width,h=pvEl.height;
if(!ensureFBO(w,h))return;
const sW=W,sH=H,sView=state.view,sPan=state.pan;
W=w;H=h;state.pan=[0,0];
setCamera('picture');
camera.matrix=multiply(perspective(2*Math.atan(H/(2*camera.focal)),w/h,.8,60),camera.view);
gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
gl.viewport(0,0,w,h);
gl.clearColor(0,0,0,0);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.useProgram(program);
gl.uniformMatrix4fv(program.matrix,false,camera.matrix);
gl.uniformMatrix4fv(program.model,false,camera.model);
gl.uniform1f(program.opacity,1);
tintMode=true;
for(const n of ['floor','bed','body','water','plants'])drawGroup(n);
gl.uniformMatrix4fv(program.model,false,identity());
if(state.example)drawGroup('person');
tintMode=false;
gl.uniform1f(program.tintMix,0);
gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,fbPix);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
W=sW;H=sH;state.pan=sPan;
setCamera(sView);
const tmpW=pvTmp.width,tmpH=pvTmp.height;
if(tmpW!==w||tmpH!==h){pvTmp.width=w;pvTmp.height=h;}
const img=pvTmpCtx.createImageData(w,h);
for(let y=0;y<h;y++){
const src=(h-1-y)*w*4,dst=y*w*4;
img.data.set(fbPix.subarray(src,src+w*4),dst);
}
pvTmpCtx.putImageData(img,0,0);
const g=pvCtx.createLinearGradient(0,0,0,h);
g.addColorStop(0,'#e9f4ff');g.addColorStop(.5,'#e9f4ff');
g.addColorStop(.5,'#f1e9dd');g.addColorStop(1,'#f1e9dd');
pvCtx.fillStyle=g;pvCtx.fillRect(0,0,w,h);
pvCtx.drawImage(pvTmp,0,0);
pvCtx.strokeStyle='rgba(11,87,255,.55)';pvCtx.lineWidth=1;
pvCtx.beginPath();pvCtx.moveTo(0,Math.round(h/2)+.5);pvCtx.lineTo(w,Math.round(h/2)+.5);pvCtx.stroke();
}

/* ================= 预览放大 ================= */
let pvBig=false,pvBack=null;
function applyPvSize(){
const box=$('#miniBox'),el=$('#preview');
if(!box||!el)return;
if(pvBig){
el.width=960;el.height=600;box.classList.add('expanded');
if(!pvBack){pvBack=document.createElement('div');pvBack.className='pv-backdrop';pvBack.addEventListener('click',()=>togglePreviewSize());(document.querySelector('.panel')||document.body).appendChild(pvBack)}
}else{
el.width=320;el.height=200;box.classList.remove('expanded');
if(pvBack){pvBack.remove();pvBack=null}
}
const z=$('#pvZoom');if(z)z.textContent=pvBig?'⤡':'⤢';
dirty=true;
}
function togglePreviewSize(){pvBig=!pvBig;applyPvSize();if(pvBig)renderPreview()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pvBig)togglePreviewSize()});

/* ================= 启动 ================= */
window.addEventListener('resize',resize);
const layoutObserver=new ResizeObserver(resize);
layoutObserver.observe($('#viewport'));
initGL();
renderVPList();
resize();
setTimeout(()=>{try{syncVPValues()}catch(e){}},60);
setStep(1);
const hashStep=Number((location.hash.match(/^\#s?(\d+)/)||[])[1]);
if(hashStep>=1&&hashStep<=10)setStep(hashStep);
dirty=true;
loop();
</script>
</body>
</html>
